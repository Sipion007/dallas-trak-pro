<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Suivi Dallas Trak</title>
<meta name="theme-color" content="#0D1A15">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=Familjen+Grotesk:wght@400;500;600&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
/* Suivi partagé : la carte en plein écran et une carte d'information en bas. */
:root{--nuit:#0D1A15;--nuit-2:#14261F;--nuit-3:#1C3229;--laterite:#C2502A;--ambre:#F2A93B;--feuille:#5E9A6E;--sable:#EFE6D8;--brume:#9AAEA2;--trait:rgba(239,230,216,.12);--display:"Big Shoulders Display","Arial Narrow",sans-serif;--texte:"Familjen Grotesk","Helvetica Neue",Arial,sans-serif;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--nuit);color:var(--sable);font-family:var(--texte);overflow:hidden;-webkit-font-smoothing:antialiased}
#carte{position:fixed;inset:0;background:#0b1511}
.leaflet-container{font-family:var(--texte)}
.leaflet-control-attribution{background:rgba(13,26,21,.7)!important;color:var(--brume)!important;font-size:10px!important}
.leaflet-control-attribution a{color:var(--sable)!important}
.marque{position:fixed;z-index:10;top:calc(env(safe-area-inset-top,0px) + 12px);left:max(14px,env(safe-area-inset-left,0px));display:flex;align-items:center;gap:8px;padding:0 16px 0 10px;height:46px;border-radius:999px;background:rgba(20,38,31,.92);border:1px solid var(--trait);font-family:var(--display);font-weight:800;font-size:1.3rem}
.fiche{position:fixed;z-index:10;left:0;right:0;bottom:0;padding:18px max(18px,env(safe-area-inset-left,0px)) calc(18px + env(safe-area-inset-bottom,0px));background:var(--nuit-2);border-top:1px solid var(--trait);border-radius:24px 24px 0 0;display:grid;gap:10px;box-shadow:0 -18px 50px rgba(0,0,0,.45)}
@media (min-width:760px){.fiche{left:20px;right:auto;bottom:20px;width:400px;border-radius:24px;border:1px solid var(--trait)}}
h1{font-family:var(--display);font-weight:800;font-size:2rem;line-height:.95;margin:0}
p{margin:0}
.mute{color:var(--brume);font-size:.92rem}
.plaque{display:inline-block;padding:3px 9px;border-radius:6px;background:var(--sable);color:var(--nuit);font-weight:700;font-size:.85rem;letter-spacing:.06em}
.etat{display:inline-flex;align-items:center;gap:8px;color:var(--ambre);font-weight:600}
.etat i{width:9px;height:9px;border-radius:50%;background:var(--ambre)}
.m-depart{width:20px;height:20px;border-radius:50%;background:var(--laterite);border:4px solid var(--sable)}
.m-arrivee{width:20px;height:20px;border-radius:50%;background:var(--nuit);border:5px solid var(--ambre)}
.m-voiture{width:44px;height:44px;display:grid;place-items:center}
.m-voiture svg{transition:transform .4s linear;filter:drop-shadow(0 4px 6px rgba(0,0,0,.5))}
.m-quartier{font:600 11px/1 var(--texte);color:#0D1A15;background:rgba(239,230,216,.92);padding:3px 7px;border-radius:999px;white-space:nowrap;transform:translate(-50%,-50%);display:inline-block;pointer-events:none}
.carte-loin .m-quartier{display:none}
</style>
</head>
<body>
<div id="carte" role="application" aria-label="Carte du trajet"></div>
<div class="marque"><svg width="24" height="24" viewBox="0 0 34 34" aria-hidden="true"><circle cx="7" cy="25" r="4.5" fill="#C2502A"/><path d="M7 25 C 7 12, 27 22, 27 9" fill="none" stroke="#F2A93B" stroke-width="2.6" stroke-linecap="round"/><circle cx="27" cy="9" r="4.5" fill="none" stroke="#F2A93B" stroke-width="2.6"/></svg>Dallas Trak</div>
<section class="fiche" id="fiche" aria-live="polite"><p class="mute">Chargement du trajet…</p></section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="commun.js"></script>
<script>
(function(){
'use strict';
var esc=DT.esc;
var jeton=new URLSearchParams(location.search).get('j');
var sb=window.supabase.createClient(DT.URL,DT.CLE,{auth:{persistSession:false,autoRefreshToken:false}});
var carte=DT.carte('carte');carte.poserTuiles('plan',false);
var fiche=document.getElementById('fiche');
var mD=null,mA=null,mV=null,cadre=false,t=null;
var TXT={recherche:'Recherche d’un chauffeur',acceptee:'Le chauffeur va chercher {c}',arrivee:'Le chauffeur est arrivé chez {c}',en_cours:'{c} est en route',terminee:'{c} est bien arrivé',annulee:'Course annulée',expiree:'Aucun chauffeur trouvé'};
function maj(){
  if(!/^[0-9a-f-]{36}$/i.test(jeton||'')){fiche.innerHTML='<h1>Lien invalide</h1><p class="mute">Demandez un nouveau lien de suivi.</p>';return}
  sb.rpc('dt_suivi',{p_jeton:jeton}).then(function(r){
    var d=r.data;
    if(r.error||!d){fiche.innerHTML='<h1>Trajet indisponible</h1><p class="mute">Ce suivi a expiré ou le lien est incorrect.</p>';return}
    var titre=(TXT[d.statut]||'').replace('{c}',esc(d.client||'Votre proche'));
    fiche.innerHTML='<span class="etat"><i></i>'+titre+'</span><h1>'+esc(d.depart.label)+' vers '+esc(d.arrivee.label)+'</h1>'+
      (d.chauffeur?'<p class="mute">Chauffeur '+esc(d.chauffeur)+' · '+esc(d.voiture||'')+'</p><p><span class="plaque">'+esc(d.plaque||'')+'</span></p>':'')+
      (d.pos&&d.pos.le?'<p class="mute">Position mise à jour à '+esc(DT.heure(d.pos.le))+'</p>':'');
    if(!mD)mD=L.marker([d.depart.lat,d.depart.lng],{icon:DT.icone('m-depart')}).addTo(carte);
    if(!mA)mA=L.marker([d.arrivee.lat,d.arrivee.lng],{icon:DT.icone('m-arrivee')}).addTo(carte);
    if(d.pos&&['acceptee','arrivee','en_cours'].indexOf(d.statut)>-1){
      if(!mV)mV=L.marker([d.pos.lat,d.pos.lng],{icon:DT.iconeVoiture(),zIndexOffset:1000}).addTo(carte);else DT.glisser(mV,d.pos.lat,d.pos.lng);
      DT.orienter(mV,d.pos.cap);
    }else if(mV){carte.removeLayer(mV);mV=null}
    if(!cadre){cadre=true;var p=[[d.depart.lat,d.depart.lng],[d.arrivee.lat,d.arrivee.lng]];if(d.pos)p.push([d.pos.lat,d.pos.lng]);carte.fitBounds(L.latLngBounds(p),{paddingTopLeft:[40,80],paddingBottomRight:[40,window.innerWidth>=760?40:220],maxZoom:16})}
    clearTimeout(t);if(['recherche','acceptee','arrivee','en_cours'].indexOf(d.statut)>-1)t=setTimeout(maj,5000);
  }).catch(function(){fiche.innerHTML='<p class="mute">Connexion impossible. Nouvel essai dans quelques secondes…</p>';clearTimeout(t);t=setTimeout(maj,8000)});
}
maj();
})();
</script>
</body>
</html>
