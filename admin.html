<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dallas Trak Administration</title>
<meta name="theme-color" content="#0D1A15">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=Familjen+Grotesk:wght@400;500;600&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
/* Espace administrateur : barre de sections en haut, contenu en cartes lisibles sur ordinateur comme sur téléphone. */
:root{
  --nuit:#0D1A15;--nuit-2:#14261F;--nuit-3:#1C3229;
  --laterite:#C2502A;--ambre:#F2A93B;--feuille:#5E9A6E;--danger:#E0533D;
  --sable:#EFE6D8;--brume:#9AAEA2;--trait:rgba(239,230,216,.12);
  --display:"Big Shoulders Display","Arial Narrow",sans-serif;
  --texte:"Familjen Grotesk","Helvetica Neue",Arial,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;min-height:100%}
body{background:var(--nuit);color:var(--sable);font-family:var(--texte);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ambre);outline-offset:2px}
a{color:var(--ambre)}
h1,h2,h3{font-family:var(--display);font-weight:800;line-height:.95;margin:0}
h1{font-size:2.4rem}h2{font-size:1.8rem}h3{font-size:1.3rem}
p{margin:0}
.mute{color:var(--brume)}.petit{font-size:.86rem}
.pile{display:grid;gap:14px}

.entete{position:sticky;top:0;z-index:20;background:rgba(13,26,21,.94);backdrop-filter:blur(12px);border-bottom:1px solid var(--trait)}
.entete .ligne1{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px max(20px,env(safe-area-inset-left,0px)) 10px}
.marque{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:800;font-size:1.45rem;white-space:nowrap}
.marque small{font-family:var(--texte);font-weight:500;font-size:.85rem;color:var(--brume)}
.onglets{display:flex;gap:4px;overflow-x:auto;padding:0 max(14px,env(safe-area-inset-left,0px)) 10px;scrollbar-width:none}
.onglets::-webkit-scrollbar{display:none}
.onglets button{flex:none;border:1px solid transparent;background:none;color:var(--brume);font-weight:600;padding:9px 14px;border-radius:999px;display:flex;align-items:center;gap:8px;white-space:nowrap}
.onglets button[aria-current="page"]{background:var(--sable);color:var(--nuit)}
.onglets button:hover:not([aria-current="page"]){border-color:var(--trait);color:var(--sable)}
.pastille{min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--laterite);color:#FFF6EC;font-size:.75rem;display:inline-grid;place-items:center}
main{max-width:1240px;margin:0 auto;padding:24px max(20px,env(safe-area-inset-left,0px)) 60px}

.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(170px,calc(50% - 5px)),1fr));gap:10px}
.kpi{padding:16px;border-radius:18px;background:var(--nuit-2);border:1px solid var(--trait)}
.kpi b{display:block;font-family:var(--display);font-weight:800;font-size:2.2rem;line-height:1;font-variant-numeric:tabular-nums}
.kpi span{color:var(--brume);font-size:.85rem}
.kpi.ambre b{color:var(--ambre)}
.grille2{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:900px){.grille2{grid-template-columns:minmax(0,1fr)}}
#carte{height:440px;border-radius:20px;border:1px solid var(--trait);overflow:hidden;background:#0b1511}
.leaflet-container{font-family:var(--texte)}
.leaflet-control-attribution{background:rgba(13,26,21,.7)!important;color:var(--brume)!important;font-size:10px!important}
.leaflet-control-attribution a{color:var(--sable)!important}

.carte-l{padding:16px;border-radius:18px;background:var(--nuit-2);border:1px solid var(--trait);display:grid;gap:12px}
.liste{display:grid;gap:10px}
.entre{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.infos{display:flex;flex-wrap:wrap;gap:6px 18px;color:var(--brume);font-size:.88rem}
.infos b{color:var(--sable);font-weight:600}
.etat{font-size:.78rem;font-weight:600;padding:3px 10px;border-radius:999px;white-space:nowrap}
.etat.ok{background:rgba(94,154,110,.18);color:#8FCB9E}
.etat.att{background:rgba(242,169,59,.15);color:var(--ambre)}
.etat.non{background:rgba(224,83,61,.15);color:#F7B3A6}
.etat.neutre{background:rgba(239,230,216,.1);color:var(--brume)}
.photos{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
@media (max-width:620px){.photos{grid-template-columns:repeat(2,minmax(0,1fr))}.entete .ligne1{padding:12px 16px 8px;gap:10px}.entete .ligne1 .actions>.mute,.marque small{display:none}.entete .ligne1 .btn{min-height:40px;padding:0 14px;font-size:.9rem}}
.photos button{padding:0;border:1px solid var(--trait);border-radius:12px;overflow:hidden;background:var(--nuit-3);aspect-ratio:4/3;position:relative}
.photos img{width:100%;height:100%;object-fit:cover;display:block}
.photos span{position:absolute;left:6px;bottom:6px;background:rgba(13,26,21,.85);padding:2px 8px;border-radius:999px;font-size:.72rem}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px;padding:0 16px;border-radius:999px;border:1px solid transparent;font-weight:600;font-size:.92rem;text-decoration:none;color:inherit;background:none}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn-plein{background:var(--laterite);color:#FFF6EC}
.btn-vert{background:var(--feuille);color:#0D1A15}
.btn-ambre{background:var(--ambre);color:var(--nuit)}
.btn-ligne{border-color:rgba(239,230,216,.25);color:var(--sable)}
.btn-ligne:hover{border-color:var(--sable)}
.btn-rouge{border-color:rgba(224,83,61,.5);color:#F7B3A6}
.btn-grand{min-height:54px;width:100%;font-size:1rem}
.saisie{width:100%;min-height:44px;padding:0 14px;border-radius:12px;background:var(--nuit-3);border:1px solid var(--trait);outline:none}
.saisie:focus{border-color:var(--ambre)}
.saisie.court{width:120px}
.saisie::placeholder{color:#7E9186}
label.etiq{display:block;font-size:.82rem;color:var(--brume);margin-bottom:5px}
.form-grille{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.erreur{color:#F08A74;font-size:.88rem}
.filtres{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.filtres button{border:1px solid var(--trait);background:var(--nuit-2);color:var(--brume);padding:7px 13px;border-radius:999px;font-weight:600;font-size:.86rem}
.filtres button[aria-pressed="true"]{border-color:var(--ambre);color:var(--sable)}
.vide{padding:28px;text-align:center;color:var(--brume);border:1px dashed var(--trait);border-radius:18px}
.alerte-carte{border-color:rgba(224,83,61,.55);background:linear-gradient(180deg,rgba(224,83,61,.12),rgba(224,83,61,0))}

.connexion{min-height:100vh;display:grid;place-items:center;padding:24px}
.connexion>div{width:100%;max-width:400px;padding:28px;border-radius:24px;background:var(--nuit-2);border:1px solid var(--trait)}

.modale{position:fixed;inset:0;z-index:70;display:grid;place-items:center;padding:20px;background:rgba(5,10,8,.82)}
.modale img{max-width:min(92vw,1000px);max-height:84vh;border-radius:14px;display:block}
.modale button{margin-top:12px}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);z-index:80;background:var(--sable);color:var(--nuit);padding:12px 18px;border-radius:14px;font-weight:600;opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;max-width:calc(100vw - 32px);text-align:center}
.toast.vu{opacity:1;transform:translate(-50%,0)}
.m-voiture{width:44px;height:44px;display:grid;place-items:center}
.m-voiture svg{filter:drop-shadow(0 4px 6px rgba(0,0,0,.5))}
.m-libre svg rect:first-child{stroke:#5E9A6E;stroke-width:2.5}
.m-depart{width:18px;height:18px;border-radius:50%;background:var(--laterite);border:3px solid var(--sable)}
.m-quartier{font:600 11px/1 var(--texte);color:#0D1A15;background:rgba(239,230,216,.92);padding:3px 7px;border-radius:999px;white-space:nowrap;transform:translate(-50%,-50%);display:inline-block;pointer-events:none}
.carte-loin .m-quartier{display:none}
.chargement{display:grid;place-items:center;min-height:200px}
.chargement i{width:28px;height:28px;border-radius:50%;border:3px solid rgba(239,230,216,.2);border-top-color:var(--ambre);animation:tourne 1s linear infinite}
@keyframes tourne{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="app"><div class="chargement"><i></i></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="commun.js"></script>
<script>
(function(){
'use strict';
var esc=DT.esc,fmt=DT.fmt,toast=DT.toast;
// Connexion par mail possible : le lien « mot de passe oublié » revient sur cette page
var sb=window.supabase.createClient(DT.URL,DT.CLE,{auth:{storageKey:'dt-admin',persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,flowType:'implicit'}});
var RETOUR=/type=recovery/.test(location.hash),LIEN_KO=/error_code=|error=/.test(location.hash);
if(RETOUR||LIEN_KO){try{if(LIEN_KO)history.replaceState(null,'',location.pathname)}catch(e){}}
var app=document.getElementById('app');
var SECTIONS=[['tableau','Tableau de bord'],['dossiers','Dossiers'],['chauffeurs','Chauffeurs'],['courses','Courses'],['recharges','Recharges'],['clients','Clients'],['alertes','Alertes'],['reglages','Réglages']];
var STATUTS={planifiee:['Planifiée','neutre'],recherche:['Recherche','att'],acceptee:['Chauffeur en route','att'],arrivee:['Chauffeur sur place','att'],en_cours:['En course','att'],terminee:['Terminée','ok'],annulee:['Annulée','non'],expiree:['Sans chauffeur','non']};
var S={moi:null,section:'tableau',stats:null,donnees:{},filtre:'actives',recherche:'',ouvert:{}};
var carte=null,couche=null,rafraichT=null;

/* ---------- Connexion ---------- */
function ecranConnexion(msg){
  arreter();
  app.innerHTML='<div class="connexion"><div class="pile"><div class="marque"><svg width="28" height="28" viewBox="0 0 34 34" aria-hidden="true"><circle cx="7" cy="25" r="4.5" fill="#C2502A"/><path d="M7 25 C 7 12, 27 22, 27 9" fill="none" stroke="#F2A93B" stroke-width="2.6" stroke-linecap="round"/><circle cx="27" cy="9" r="4.5" fill="none" stroke="#F2A93B" stroke-width="2.6"/></svg>Dallas Trak</div>'+
    '<div><h1>Administration</h1><p class="mute" style="margin-top:6px">Accès réservé à l’équipe Dallas Trak.</p></div>'+
    '<form id="f" class="pile" novalidate><div><label class="etiq" for="tel">Adresse mail ou numéro de téléphone</label><input class="saisie" id="tel" autocomplete="username" autocapitalize="off" spellcheck="false"></div>'+
    '<div><label class="etiq" for="mdp">Mot de passe</label><input class="saisie" id="mdp" type="password" autocomplete="current-password"></div>'+
    '<p class="erreur" id="err"'+(msg?'':' hidden')+'>'+esc(msg||'')+'</p><button class="btn btn-plein btn-grand" id="ok">Se connecter</button></form>'+
    '<button type="button" class="btn btn-ligne" id="oubli">Mot de passe oublié</button><p class="mute petit" id="oubli-txt" role="status" hidden></p></div></div>';
  var err=document.getElementById('err');
  function montrer(m){err.textContent=m;err.hidden=false}
  document.getElementById('f').addEventListener('submit',function(e){
    e.preventDefault();
    var b=document.getElementById('ok'),id=document.getElementById('tel').value.trim(),mdp=document.getElementById('mdp').value;
    if(!id){montrer('Entrez votre adresse mail ou votre numéro.');return}
    if(!mdp){montrer('Entrez votre mot de passe.');return}
    b.disabled=true;b.textContent='Connexion…';err.hidden=true;
    var p=id.indexOf('@')>-1
      ?sb.auth.signInWithPassword({email:id.toLowerCase(),password:mdp}).then(function(r){if(r.error){if(/invalid login|invalid credentials|invalid_grant/i.test(r.error.message))throw new Error('Adresse mail ou mot de passe incorrect.');throw r.error}})
      :DT.connecter(sb,id,mdp);
    p.then(demarrer).catch(function(x){b.disabled=false;b.textContent='Se connecter';montrer(DT.msg(x))});
  });
  document.getElementById('oubli').addEventListener('click',function(){
    var id=document.getElementById('tel').value.trim().toLowerCase(),t=document.getElementById('oubli-txt'),b=this;
    if(!/^[^@\s]+@[^@\s]+\.[a-z]{2,}$/.test(id)){montrer('Entrez d’abord votre adresse mail dans le premier champ, puis touchez « Mot de passe oublié ».');return}
    err.hidden=true;b.disabled=true;b.textContent='Envoi…';
    sb.auth.resetPasswordForEmail(id,{redirectTo:location.origin+location.pathname}).then(function(r){
      b.disabled=false;b.textContent='Mot de passe oublié';
      if(r&&r.error&&!/rate|limit/i.test(r.error.message)){montrer(DT.msg(r.error));return}
      if(r&&r.error){montrer('Trop de demandes en peu de temps. Réessayez dans une heure.');return}
      t.textContent='Si cette adresse correspond à un compte administrateur, un mail vient de lui être envoyé. Ouvrez le lien qu’il contient pour choisir un nouveau mot de passe. Pensez à regarder dans les indésirables (spam).';t.hidden=false;
    });
  });
}
// Arrivée par le lien du mail : choisir un nouveau mot de passe
function ecranNouveauMdp(){
  arreter();
  app.innerHTML='<div class="connexion"><div class="pile"><div><h1>Nouveau mot de passe</h1><p class="mute" style="margin-top:6px">Choisissez le mot de passe de votre compte administrateur.</p></div>'+
    '<form id="f" class="pile" novalidate><div><label class="etiq" for="n1">Nouveau mot de passe</label><input class="saisie" id="n1" type="password" autocomplete="new-password" placeholder="8 caractères minimum"></div>'+
    '<div><label class="etiq" for="n2">Confirmation</label><input class="saisie" id="n2" type="password" autocomplete="new-password"></div>'+
    '<p class="erreur" id="err" hidden></p><button class="btn btn-plein btn-grand" id="ok">Enregistrer</button></form></div></div>';
  document.getElementById('f').addEventListener('submit',function(e){
    e.preventDefault();
    var a=document.getElementById('n1').value,c=document.getElementById('n2').value,err=document.getElementById('err'),b=document.getElementById('ok');
    if(a.length<8){err.textContent='Le mot de passe doit avoir au moins 8 caractères.';err.hidden=false;return}
    if(a!==c){err.textContent='Les deux mots de passe ne sont pas identiques.';err.hidden=false;return}
    b.disabled=true;b.textContent='Enregistrement…';
    sb.auth.updateUser({password:a}).then(function(r){
      if(r.error){b.disabled=false;b.textContent='Enregistrer';err.textContent=/same|different/i.test(r.error.message)?'Choisissez un mot de passe différent de l’ancien.':DT.msg(r.error);err.hidden=false;return}
      RETOUR=false;try{history.replaceState(null,'',location.pathname)}catch(x){}
      toast('Mot de passe enregistré');demarrer();
    });
  });
}
function demarrer(){
  return sb.auth.getSession().then(function(r){
    var s=r.data&&r.data.session;
    if(!s){ecranConnexion(LIEN_KO?'Ce lien a expiré ou a déjà servi. Demandez un nouveau lien avec « Mot de passe oublié ».':'');LIEN_KO=false;return}
    if(RETOUR){ecranNouveauMdp();return}
    return Promise.all([DT.appel(sb.from('dt_profils').select('*').eq('id',s.user.id).maybeSingle()),DT.chargerConfig(sb)]).then(function(res){
      var p=res[0];
      if(!p||!p.est_admin||p.suspendu){return sb.auth.signOut().then(function(){ecranConnexion('Ce compte n’a pas accès à l’administration.')})}
      S.moi=p;cadre();ouvrir(S.section);
    });
  }).catch(function(x){ecranConnexion(DT.msg(x))});
}

/* ---------- Cadre ---------- */
function cadre(){
  app.innerHTML='<header class="entete"><div class="ligne1"><div class="marque"><svg width="26" height="26" viewBox="0 0 34 34" aria-hidden="true"><circle cx="7" cy="25" r="4.5" fill="#C2502A"/><path d="M7 25 C 7 12, 27 22, 27 9" fill="none" stroke="#F2A93B" stroke-width="2.6" stroke-linecap="round"/><circle cx="27" cy="9" r="4.5" fill="none" stroke="#F2A93B" stroke-width="2.6"/></svg>Dallas Trak <small>Administration</small></div>'+
    '<div class="actions"><span class="mute petit">'+esc(S.moi.nom)+'</span><button class="btn btn-ligne" id="sortir">Se déconnecter</button></div></div>'+
    '<nav class="onglets" aria-label="Sections">'+SECTIONS.map(function(s){return '<button data-section="'+s[0]+'">'+s[1]+'<span class="pastille" id="p-'+s[0]+'" hidden></span></button>'}).join('')+'</nav></header><main id="main"></main>';
  app.querySelectorAll('[data-section]').forEach(function(b){b.addEventListener('click',function(){ouvrir(b.getAttribute('data-section'))})});
  document.getElementById('sortir').addEventListener('click',function(){sb.auth.signOut().then(function(){S.moi=null;ecranConnexion()})});
}
function ouvrir(sec){
  S.section=sec;
  app.querySelectorAll('[data-section]').forEach(function(b){if(b.getAttribute('data-section')===sec)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});
  if(carte){carte.remove();carte=null;couche=null}
  var m=document.getElementById('main');m.innerHTML='<div class="chargement"><i></i></div>';
  rafraichir(true);
}
function arreter(){clearTimeout(rafraichT);rafraichT=null}
function rafraichir(premier){
  arreter();
  var sec=S.section;
  Promise.all([DT.appel(sb.rpc('dt_admin_stats')),charger(sec)]).then(function(r){
    if(S.section!==sec)return;
    S.stats=r[0];pastilles();
    if(premier||!saisieEnCours())afficher(sec);
  }).catch(function(x){
    var t=DT.msg(x);
    if(/session|Reconnectez|réservé/i.test(t)){ecranConnexion(t);return}
    toast(t,true);
  }).then(function(){
    if(S.moi&&S.section===sec)rafraichT=setTimeout(function(){rafraichir(false)},['tableau','alertes','recharges','dossiers'].indexOf(sec)>-1?10000:30000);
  });
}
// On ne redessine pas pendant que l'administrateur écrit
function saisieEnCours(){var a=document.activeElement;return a&&(a.tagName==='INPUT'||a.tagName==='TEXTAREA'||a.tagName==='SELECT')&&document.getElementById('main').contains(a)}
function pastilles(){
  var st=S.stats||{};
  [['dossiers',st.dossiers_attente],['recharges',st.recharges_attente],['alertes',st.alertes]].forEach(function(x){var p=document.getElementById('p-'+x[0]);if(p){p.textContent=x[1];p.hidden=!x[1]}});
}

/* ---------- Données ---------- */
function charger(sec){
  var D=S.donnees;
  if(sec==='tableau'){
    return Promise.all([
      DT.appel(sb.from('dt_chauffeurs').select('id,lat,lng,cap,en_service,position_le,voiture,plaque,dt_profils(nom,telephone)').eq('en_service',true)),
      DT.appel(sb.from('dt_courses').select('*').in('statut',['recherche','acceptee','arrivee','en_cours']).order('cree_le',{ascending:false}))
    ]).then(function(r){D.service=r[0]||[];D.actives=r[1]||[]});
  }
  if(sec==='dossiers'){
    return DT.appel(sb.from('dt_chauffeurs').select('*,dt_profils(nom,telephone,cree_le)').eq('statut','en_attente').order('soumis_le')).then(function(l){D.dossiers=l||[];return photos(D.dossiers.map(function(c){return c.id}))});
  }
  if(sec==='chauffeurs'){
    return DT.appel(sb.from('dt_chauffeurs').select('*,dt_profils(nom,telephone,suspendu)').neq('statut','en_attente').order('cree_le',{ascending:false})).then(function(l){D.chauffeurs=l||[]});
  }
  if(sec==='courses'){
    var q=sb.from('dt_courses').select('*').order('cree_le',{ascending:false}).limit(150);
    if(S.filtre==='actives')q=q.in('statut',['planifiee','recherche','acceptee','arrivee','en_cours']);
    else if(S.filtre!=='toutes')q=q.eq('statut',S.filtre);
    return DT.appel(q).then(function(l){D.courses=l||[]});
  }
  if(sec==='recharges'){
    return DT.appel(sb.from('dt_recharges').select('*,dt_chauffeurs(solde,dt_profils(nom,telephone))').order('cree_le',{ascending:false}).limit(100)).then(function(l){D.recharges=l||[]});
  }
  if(sec==='clients'){
    return DT.appel(sb.from('dt_profils').select('*').order('cree_le',{ascending:false}).limit(500)).then(function(l){D.clients=l||[]});
  }
  if(sec==='alertes'){
    return DT.appel(sb.from('dt_alertes').select('*,dt_courses(client_nom,client_tel,chauffeur_nom,chauffeur_tel,voiture,plaque,statut,depart_label,arrivee_label),dt_profils(nom,telephone)').order('cree_le',{ascending:false}).limit(50)).then(function(l){D.alertes=l||[]});
  }
  if(sec==='reglages')return DT.chargerConfig(sb);
  return Promise.resolve();

function afficher(sec){
  var m=document.getElementById('main');if(!m)return;
  // Tableau de bord : la carte reste en place (zoom et position conservés), seuls les chiffres et les marqueurs changent
  if(sec==='tableau'&&carte&&document.getElementById('carte')){
    var tmp=document.createElement('div');tmp.innerHTML=V.tableau();
    ['tb-kpis','tb-liste'].forEach(function(id){document.getElementById(id).innerHTML=tmp.querySelector('#'+id).innerHTML});
    lier(sec);majCouche(false);return;
  }
  if(carte){carte.remove();carte=null;couche=null}
  // Les textes déjà saisis sont conservés lors de l'actualisation automatique
  var gardes={};m.querySelectorAll('input[id],textarea[id]').forEach(function(i){if(i.id!=='cherche')gardes[i.id]=i.value});
  m.innerHTML=V[sec]();
  Object.keys(gardes).forEach(function(id){var i=document.getElementById(id);if(i&&gardes[id]!==undefined)i.value=gardes[id]});
  lier(sec);
  if(sec==='tableau')dessinerCarte();
}

function majCouche(cadrer){
  if(!couche)return;
  couche.clearLayers();
  var pts=[];
  (S.donnees.service||[]).forEach(function(ch){
    if(ch.lat==null)return;
    var occupe=(S.donnees.actives||[]).some(function(c){return c.chauffeur_id===ch.id});
    var m=L.marker([ch.lat,ch.lng],{icon:DT.iconeVoiture(occupe?'':'m-libre'),title:(ch.dt_profils?ch.dt_profils.nom:'')+' · '+ch.plaque}).addTo(couche);
    DT.orienter(m,ch.cap);
    m.bindTooltip(esc((ch.dt_profils?ch.dt_profils.nom:'')+' · '+ch.plaque+(occupe?' · en course':' · libre')));
    pts.push([ch.lat,ch.lng]);
  });
  (S.donnees.actives||[]).forEach(function(c){
    L.marker([c.depart_lat,c.depart_lng],{icon:DT.icone('m-depart'),title:c.client_nom}).bindTooltip(esc(c.client_nom+' · '+(STATUTS[c.statut]||[''])[0])).addTo(couche);
    pts.push([c.depart_lat,c.depart_lng]);
  });
  if(!cadrer)return;
  if(pts.length)carte.fitBounds(L.latLngBounds(pts),{padding:[40,40],maxZoom:15});else carte.setView(DT.DALOA,14);
}

function lier(sec){
  var m=document.getElementById('main');
  function q(sel,fn){m.querySelectorAll(sel).forEach(function(b){b.addEventListener('click',function(){fn(b)})})}
  q('[data-photo]',function(b){var u=b.getAttribute('data-photo');if(!u)return;var d=document.createElement('div');d.className='modale';d.innerHTML='<div><img src="'+esc(u)+'" alt=""><button class="btn btn-ligne">Fermer</button></div>';d.addEventListener('click',function(){d.remove()});document.body.appendChild(d)});
  q('[data-annuler]',function(b){var id=b.getAttribute('data-annuler');if(!S.ouvert['a'+id]){S.ouvert['a'+id]=1;afficher(sec);return}action(sb.rpc('dt_admin_annuler_course',{p_course:id}),'Course annulée',b)});
  q('[data-valider]',function(b){var id=b.getAttribute('data-valider'),bonus=parseInt(document.getElementById('b-'+id).value,10)||0;action(sb.rpc('dt_admin_dossier',{p_chauffeur:id,p_decision:'valider',p_bonus:bonus}),'Chauffeur validé',b)});
  q('[data-refuser]',function(b){var id=b.getAttribute('data-refuser'),motif=document.getElementById('m-'+id).value.trim();if(motif.length<3){toast('Indiquez le motif du refus');document.getElementById('m-'+id).focus();return}action(sb.rpc('dt_admin_dossier',{p_chauffeur:id,p_decision:'refuser',p_motif:motif}),'Dossier refusé',b)});
  q('[data-suspendre]',function(b){var id=b.getAttribute('data-suspendre'),on=b.getAttribute('data-etat')==='1';action(sb.rpc('dt_admin_suspendre',{p_utilisateur:id,p_suspendre:on}),on?'Compte suspendu':'Compte réactivé',b)});
  q('[data-ouvrir]',function(b){var id=b.getAttribute('data-ouvrir');S.ouvert={};S.ouvert[id]='solde';afficher(sec)});
  q('[data-mdp]',function(b){var id=b.getAttribute('data-mdp');S.ouvert={};S.ouvert[id]='mdp';afficher(sec);var i=document.getElementById('mdp-'+id);if(i)i.focus()});
  q('[data-voir]',function(b){var id=b.getAttribute('data-voir');photos([id]).then(function(){S.ouvert={};S.ouvert[id]='photos';afficher(sec)})});
  q('[data-ajuster]',function(b){var id=b.getAttribute('data-ajuster'),v=parseInt(String(document.getElementById('aj-'+id).value).replace(/[^0-9-]/g,''),10),l=document.getElementById('ajl-'+id).value.trim();if(!v){toast('Indiquez un montant, par exemple 2000 ou -500');return}action(sb.rpc('dt_admin_ajuster',{p_chauffeur:id,p_montant:v,p_libelle:l}),'Solde ajusté',b)});
  q('[data-mdp-ok]',function(b){
    var id=b.getAttribute('data-mdp-ok'),v=document.getElementById('mdp-'+id).value;
    if(v.length<6){toast('6 caractères minimum');return}
    b.disabled=true;
    sb.auth.getSession().then(function(r){
      return fetch(DT.URL+'/functions/v1/dt-admin',{method:'POST',headers:{'Content-Type':'application/json',apikey:DT.CLE,Authorization:'Bearer '+r.data.session.access_token},body:JSON.stringify({action:'mot_de_passe',utilisateur:id,mot_de_passe:v})});
    }).then(function(r){return r.json()}).then(function(j){if(!j.ok)throw new Error(j.erreur||'Changement impossible');toast('Mot de passe changé');S.ouvert={};afficher(sec)}).catch(function(x){b.disabled=false;toast(DT.msg(x),true)});
  });
  q('[data-rvalider]',function(b){var id=b.getAttribute('data-rvalider');if(!S.ouvert['r'+id]){S.ouvert['r'+id]=1;afficher(sec);return}action(sb.rpc('dt_admin_recharge',{p_recharge:id,p_valider:true}),'Recharge validée, solde crédité',b)});
  q('[data-rrejeter]',function(b){var id=b.getAttribute('data-rrejeter'),motif=document.getElementById('rm-'+id).value.trim();if(motif.length<3){toast('Indiquez le motif du rejet');return}action(sb.rpc('dt_admin_recharge',{p_recharge:id,p_valider:false,p_motif:motif}),'Recharge rejetée',b)});
  q('[data-traitee]',function(b){action(sb.rpc('dt_admin_alerte_traitee',{p_alerte:b.getAttribute('data-traitee')}),'Alerte traitée',b)});
  q('[data-filtre]',function(b){S.filtre=b.getAttribute('data-filtre');rafraichir(true)});
  var ch=document.getElementById('cherche');
  if(ch){ch.addEventListener('input',function(){S.recherche=ch.value;var pos=ch.selectionStart;afficher(sec);var n=document.getElementById('cherche');n.focus();n.setSelectionRange(pos,pos)})}
  if(sec==='reglages'){
    var ids=['prix_base','prix_km','prix_min','arrondi','commission_pct','seuil_solde','rayon_km'];
    ids.forEach(function(k){document.getElementById('g-'+k).addEventListener('input',function(){
      var c=Object.assign({},DT.CONFIG);ids.forEach(function(x){c[x]=parseFloat(String(document.getElementById('g-'+x).value).replace(',','.'))||0});
      var p=Math.round(Math.max(c.prix_min,c.prix_base+c.prix_km*4)/(c.arrondi||1))*(c.arrondi||1);document.getElementById('exemple').textContent=fmt(p)+' F';
    })});
    document.getElementById('enregistrer').addEventListener('click',function(){
      var p={};ids.forEach(function(k){p[k]=parseFloat(String(document.getElementById('g-'+k).value).replace(',','.'))});
      if(ids.some(function(k){return isNaN(p[k])})){var e=document.getElementById('err');e.textContent='Tous les tarifs doivent être des nombres.';e.hidden=false;return}
      ['momo_orange','momo_mtn','momo_moov','momo_wave','service_tel'].forEach(function(k){p[k]=DT.telNorm(document.getElementById('g-'+k).value)});
      action(sb.rpc('dt_admin_config',{p:p}),'Réglages enregistrés',document.getElementById('enregistrer'));
    });
  }
}

sb.auth.onAuthStateChange(function(ev){if(ev==='PASSWORD_RECOVERY'&&!RETOUR){RETOUR=true;ecranNouveauMdp();return}if(ev==='SIGNED_OUT'&&S.moi){S.moi=null;ecranConnexion('Votre session a expiré. Reconnectez-vous.')}});
demarrer();
})();
</script>
</body>
</html>
